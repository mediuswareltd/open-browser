<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenBrowser</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="setup-screen" class="setup-screen">
    <section class="setup-card">
      <h2 class="setup-title">Select Planner</h2>
      <div class="provider-row">
        <label for="setup-planner-select" class="sr-only">Select Planner</label>
        <select id="setup-planner-select" class="ai-provider-select" title="Select planner">
          <option class="ai-provider-select-option" value="heuristic" disabled>Quick (heuristic, no API key needed)</option>
          <option class="ai-provider-select-option" value="gemini" selected>Gemini</option>
          <option class="ai-provider-select-option" value="ollama" disabled>Ollama</option>
        </select>
        <div id="setup-api-key-field" class="api-key-field">
          <input type="password" id="setup-api-key-input" class="api-key-input" placeholder="Gemini API key" autocomplete="off" title="Gemini API key">
          <button type="button" id="btn-setup-api-key-visibility" class="api-key-toggle" aria-label="Show API key" title="Show API key">
            <span class="api-key-eye" aria-hidden="true"></span>
          </button>
        </div>
        <p id="setup-error" class="setup-error" hidden>Invalid Gemini API key</p>
      </div>
      <div class="execute-buttons">
        <button id="btn-setup-continue" class="btn-primary">
          <span class="btn-text">Continue</span>
        </button>
      </div>
    </section>
  </div>

  <div id="app-shell" class="layout" hidden>
    <aside id="sidebar" class="sidebar" role="complementary">
      <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="Toggle sidebar" title="Toggle sidebar">
        <span class="sidebar-toggle-icon" aria-hidden="true">&#9664;</span>
      </button>
      <div class="sidebar-content">
        <header class="sidebar-header">
          <div class="logo">
            <img src="../arts/logo.png" alt="" class="logo-icon" width="32" height="32">
            <div class="logo-text">
              <h1>OpenBrowser</h1>
              <span class="tagline">Project task workspace</span>
            </div>
          </div>
        </header>

        <div id="view-projects" class="sidebar-view sidebar-view--active">
          <section class="projects-section projects-section--highlight">
            <div class="list-section-header">
              <h3 class="projects-section-title">Projects</h3>
              <button id="btn-new-project" class="btn-secondary btn-sm" type="button">+ New Project</button>
            </div>
            <div id="project-list" class="project-list project-list--flex"></div>
          </section>
        </div>

        <div id="view-project-detail" class="sidebar-view" hidden>
          <button type="button" id="btn-back-to-projects" class="back-to-projects">
            <span class="back-to-projects-icon" aria-hidden="true">&#8592;</span>
            Back to Projects
          </button>
          <div class="project-detail-header project-detail-header--row">
            <span id="project-detail-name" class="project-detail-name">Project</span>
            <input type="text" id="project-name-edit" class="project-name-input project-name-inline" hidden aria-label="Project name">
          </div>

          <section class="projects-section projects-section--highlight">
            <div class="list-section-header">
              <h3 class="projects-section-title">Tasks</h3>
              <button id="btn-new-task" class="btn-secondary btn-sm" type="button">+ New Task</button>
            </div>
            <div id="task-list" class="project-list task-list"></div>
          </section>

          <section class="goal-section goal-section--open">
            <h3 class="goal-section-title">Prompt</h3>
            <p class="goal-section-desc">What do you want to automate?</p>
            <textarea id="task-prompt-input" rows="3" placeholder="What do you want to automate?"></textarea>
            <div class="execute-buttons">
              <button id="btn-add-task-prompt" class="btn-primary" type="button">
                <span class="btn-text">Add Prompt</span>
              </button>
            </div>
          </section>

          <section class="actions-section">
            <h3>Prompt History</h3>
            <div id="prompt-history" class="action-log">
              <div id="prompt-history-empty" class="action-log-empty">No prompts yet. Add a prompt above.</div>
            </div>
          </section>
        </div>

        <footer class="sidebar-footer">
          <div class="footer-meta">
            <span class="footer-text">OpenBrowser</span>
            <span class="footer-version">v0.1.0</span>
          </div>
          <div id="settings-menu" class="settings-menu">
            <button type="button" id="btn-settings" class="btn-secondary btn-sm btn-settings">Settings</button>
            <div id="settings-panel" class="settings-panel" hidden>
              <h3 class="settings-title">Settings</h3>
              <label for="settings-provider-select" class="settings-label">AI Provider</label>
              <select id="settings-provider-select" class="ai-provider-select" title="AI provider">
                <option value="heuristic" disabled>Quick (heuristic, no API key needed)</option>
                <option value="gemini" selected>Gemini</option>
                <option value="ollama" disabled>Ollama</option>
              </select>
              <label for="settings-api-key-input" class="settings-label">Gemini API Key</label>
              <div id="settings-api-key-field" class="api-key-field">
                <input type="password" id="settings-api-key-input" class="api-key-input" placeholder="Gemini API key" autocomplete="off">
                <button type="button" id="btn-settings-api-key-visibility" class="api-key-toggle" aria-label="Show API key" title="Show API key">
                  <span class="api-key-eye" aria-hidden="true"></span>
                </button>
              </div>
              <label for="settings-model-select" class="settings-label">Models</label>
              <select id="settings-model-select" class="ai-provider-select" title="Gemini model"></select>
              <div class="settings-actions">
                <button type="button" id="btn-settings-change-key" class="btn-primary btn-sm">Change Key</button>
              </div>
              <p id="settings-message" class="settings-message" hidden></p>
              <div class="settings-footer-actions">
                <button type="button" id="btn-settings-remove-key" class="btn-secondary btn-sm">Remove API Key</button>
              </div>
            </div>
          </div>
        </footer>
      </div>
    </aside>

    <main class="browser-area">
      <div class="browser-chrome">
        <span class="url-bar-icon" aria-hidden="true">&#9671;</span>
        <input type="text" id="url-bar" class="url-bar" placeholder="Enter URL or search..." value="https://www.google.com" aria-label="Address" spellcheck="false">
        <button id="btn-go" class="btn-go" type="button">Go</button>
      </div>
    </main>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
